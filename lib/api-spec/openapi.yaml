openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.4.0
  description: مِرفق API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: properties
    description: Property management
  - name: units
    description: Unit management
  - name: requests
    description: Maintenance requests
  - name: technicians
    description: Technician profiles
  - name: dashboard
    description: Dashboard statistics
  - name: public
    description: Public QR maintenance reporting
  - name: preventive
    description: Preventive maintenance plans
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /properties:
    get:
      operationId: getProperties
      tags: [properties]
      summary: List manager properties
      responses:
        "200":
          description: List of properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Create a property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"

  /properties/{id}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          description: Not found
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Delete a property
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /properties/{propertyId}/units:
    get:
      operationId: getUnits
      tags: [units]
      summary: List units in a property
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: createUnit
      tags: [units]
      summary: Create a unit
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"

  /units/{id}:
    patch:
      operationId: updateUnit
      tags: [units]
      summary: Update a unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
    delete:
      operationId: deleteUnit
      tags: [units]
      summary: Delete a unit
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /units/{id}/public-token/rotate:
    post:
      operationId: rotateUnitPublicToken
      tags: [units]
      summary: Replace a unit public QR token (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token rotated and updated unit returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "404":
          description: Unit not found

  /requests:
    get:
      operationId: getRequests
      tags: [requests]
      summary: List maintenance requests (role-filtered)
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MaintenanceRequest"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a maintenance request (resident only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a maintenance request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"
        "404":
          description: Not found
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update a maintenance request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"

  /requests/{id}/costs:
    patch:
      operationId: updateRequestCosts
      tags: [requests]
      summary: Update request labor and parts costs (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCostsInput"
      responses:
        "200":
          description: Costs updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"
        "400":
          description: Invalid costs
        "404":
          description: Request not found

  /requests/{id}/rating:
    post:
      operationId: rateRequest
      tags: [requests]
      summary: Rate a completed request (owning resident only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestRatingInput"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceRequest"
        "400":
          description: Invalid rating
        "404":
          description: Request not found
        "409":
          description: Request incomplete or already rated

  /requests/{requestId}/comments:
    get:
      operationId: getRequestComments
      tags: [requests]
      summary: Get comments for a request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [requests]
      summary: Add a comment to a request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /technicians:
    get:
      operationId: getTechnicians
      tags: [technicians]
      summary: List technician profiles (manager only)
      responses:
        "200":
          description: List of technicians
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TechnicianProfile"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics (manager only)
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /public/units/{token}:
    get:
      operationId: getPublicUnit
      tags: [public]
      summary: Resolve a unit public QR token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public unit details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUnit"
        "404":
          description: Unit not found
        "429":
          description: Rate limit exceeded

  /public/units/{token}/requests:
    post:
      operationId: createPublicRequest
      tags: [public]
      summary: Create a maintenance request from a unit QR page
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicRequestCreated"
        "400":
          description: Invalid request data
        "404":
          description: Unit not found
        "409":
          description: Unit has no resident
        "429":
          description: Rate limit exceeded

  /preventive-plans:
    get:
      operationId: getPreventivePlans
      tags: [preventive]
      summary: List preventive plans (manager or assigned technician)
      parameters:
        - name: propertyId
          in: query
          required: false
          schema:
            type: string
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Preventive plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PreventivePlan"
    post:
      operationId: createPreventivePlan
      tags: [preventive]
      summary: Create a preventive plan (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreventivePlanInput"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivePlan"
        "400":
          description: Invalid plan data

  /preventive-plans/{id}:
    get:
      operationId: getPreventivePlan
      tags: [preventive]
      summary: Get a preventive plan (manager or assigned technician)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preventive plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivePlan"
        "403":
          description: Forbidden
        "404":
          description: Plan not found
    patch:
      operationId: updatePreventivePlan
      tags: [preventive]
      summary: Update a preventive plan (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreventivePlanUpdate"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivePlan"
        "400":
          description: Invalid plan data
        "404":
          description: Plan not found
    delete:
      operationId: deletePreventivePlan
      tags: [preventive]
      summary: Delete a preventive plan (manager only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Plan not found

  /preventive-plans/{id}/complete:
    post:
      operationId: completePreventivePlan
      tags: [preventive]
      summary: Complete a plan cycle and schedule its next due date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plan cycle completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreventivePlan"
        "403":
          description: Forbidden
        "404":
          description: Plan not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      required: [id, name, email, role, organizationId]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        role:
          type: string
        isActive:
          type: boolean
        unitId:
          type: ["string", "null"]
        organizationId:
          type: string
        organizationName:
          type: string
        brandColor:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    Property:
      type: object
      required: [id, name, address, managerId, createdAt, unitCount]
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        managerId:
          type: string
        createdAt:
          type: string
        unitCount:
          type: integer

    PropertyInput:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1

    PropertyUpdate:
      type: object
      properties:
        name:
          type: string
        address:
          type: string

    Unit:
      type: object
      required: [id, number, floor, propertyId, publicToken]
      properties:
        id:
          type: string
        number:
          type: string
        floor:
          type: integer
        propertyId:
          type: string
        publicToken:
          type: string
          description: Opaque token used in the unit public QR URL; managers can rotate it
        residentId:
          type: ["string", "null"]
        residentName:
          type: ["string", "null"]

    UnitInput:
      type: object
      required: [number, floor]
      properties:
        number:
          type: string
          minLength: 1
        floor:
          type: integer
        residentId:
          type: ["string", "null"]

    UnitUpdate:
      type: object
      properties:
        number:
          type: string
        floor:
          type: integer
        residentId:
          type: ["string", "null"]

    MaintenanceRequest:
      type: object
      required: [id, title, description, category, priority, status, propertyId, unitId, residentId, laborCost, partsCost, totalCost, createdAt, updatedAt]
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        priority:
          type: string
        status:
          type: string
        propertyId:
          type: string
        propertyName:
          type: ["string", "null"]
        unitId:
          type: string
        unitNumber:
          type: ["string", "null"]
        residentId:
          type: string
        residentName:
          type: ["string", "null"]
        reporterName:
          type: ["string", "null"]
          description: Name entered by a public QR reporter
        reporterPhone:
          type: ["string", "null"]
          description: Phone entered by a public QR reporter
        technicianId:
          type: ["string", "null"]
        technicianName:
          type: ["string", "null"]
        laborCost:
          type: number
          minimum: 0
          maximum: 10000000
          multipleOf: 0.01
        partsCost:
          type: number
          minimum: 0
          maximum: 10000000
          multipleOf: 0.01
        totalCost:
          type: number
          minimum: 0
          readOnly: true
        rating:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        ratingComment:
          type: ["string", "null"]
        ratedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RequestInput:
      type: object
      required: [title, description, category, priority, unitId]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
        category:
          type: string
        priority:
          type: string
        unitId:
          type: string

    RequestUpdate:
      type: object
      properties:
        status:
          type: string
        priority:
          type: string
        technicianId:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: string

    RequestCostsInput:
      type: object
      minProperties: 1
      properties:
        laborCost:
          type: number
          minimum: 0
          maximum: 10000000
          multipleOf: 0.01
        partsCost:
          type: number
          minimum: 0
          maximum: 10000000
          multipleOf: 0.01

    RequestRatingInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000

    PublicUnit:
      type: object
      required: [orgName, propertyName, unitId, unitNumber]
      properties:
        orgName:
          type: string
        propertyName:
          type: string
        unitId:
          type: string
        unitNumber:
          type: string

    PublicRequestInput:
      type: object
      required: [name, phone, title, description, category, priority]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        phone:
          type: string
          minLength: 7
          maxLength: 25
        title:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 10
          maxLength: 3000
        category:
          type: string
          enum: [كهرباء, سباكة, تكييف, أخرى]
        priority:
          type: string
          enum: [عاجل, عادي]

    PublicRequestCreated:
      type: object
      required: [id, title, status, propertyName, unitNumber, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
        propertyName:
          type: string
        unitNumber:
          type: string
        createdAt:
          type: string
          format: date-time

    PreventivePlan:
      type: object
      required: [id, organizationId, propertyId, propertyName, unitId, unitNumber, assignedTechnicianId, assignedTechnicianName, title, category, frequencyDays, nextDueAt, notes, isActive, lastCompletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        propertyId:
          type: string
        propertyName:
          type: ["string", "null"]
        unitId:
          type: ["string", "null"]
        unitNumber:
          type: ["string", "null"]
        assignedTechnicianId:
          type: ["string", "null"]
        assignedTechnicianName:
          type: ["string", "null"]
        title:
          type: string
        category:
          type: string
        frequencyDays:
          type: integer
          minimum: 1
          maximum: 3650
        nextDueAt:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean
        lastCompletedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PreventivePlanInput:
      type: object
      required: [propertyId, title, category, frequencyDays, nextDueAt]
      properties:
        propertyId:
          type: string
        unitId:
          type: ["string", "null"]
        assignedTechnicianId:
          type: ["string", "null"]
        title:
          type: string
          minLength: 2
          maxLength: 160
        category:
          type: string
          minLength: 2
        frequencyDays:
          type: integer
          minimum: 1
          maximum: 3650
        nextDueAt:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean

    PreventivePlanUpdate:
      type: object
      minProperties: 1
      properties:
        propertyId:
          type: string
        unitId:
          type: ["string", "null"]
        assignedTechnicianId:
          type: ["string", "null"]
        title:
          type: string
          minLength: 2
          maxLength: 160
        category:
          type: string
          minLength: 2
        frequencyDays:
          type: integer
          minimum: 1
          maximum: 3650
        nextDueAt:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]
        isActive:
          type: boolean

    Comment:
      type: object
      required: [id, content, requestId, authorId, authorName, createdAt]
      properties:
        id:
          type: string
        content:
          type: string
        requestId:
          type: string
        authorId:
          type: string
        authorName:
          type: string
        createdAt:
          type: string

    CommentInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    TechnicianProfile:
      type: object
      required: [id, userId, name, specialty, phone, activeJobsCount]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        specialty:
          type: string
        phone:
          type: string
        activeJobsCount:
          type: integer

    DashboardStats:
      type: object
      required: [totalRequests, pending, inProgress, completed, totalProperties, totalUnits, totalTechnicians]
      properties:
        totalRequests:
          type: integer
        pending:
          type: integer
        inProgress:
          type: integer
        completed:
          type: integer
        totalProperties:
          type: integer
        totalUnits:
          type: integer
        totalTechnicians:
          type: integer
